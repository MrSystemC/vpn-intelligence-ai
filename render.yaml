databases:
  - name: vpn-intelligence-db
    databaseName: vpn_intelligence
    user: vpn_intelligence
    plan: free
    region: ohio
    postgresMajorVersion: "18"

services:
  - type: web
    name: vpn-intelligence-ai
    runtime: docker
    plan: free
    region: ohio
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: vpn-intelligence-db
          property: connectionString
      - key: BOOTSTRAP_ADMIN_KEY
        generateValue: true
